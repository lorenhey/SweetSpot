[project]
name = "sweetspot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
sweetspot = "sweetspot.cli.main:app"
sweetspot-gui = "sweetspot.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
